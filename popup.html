<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker : Ultimate Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-shell">
        <section id="capture-view" class="view capture-view">
            <header class="app-header capture-header">
                <div class="brand-block">
                    <h1 data-i18n="title">Color Picker</h1>
                    <p>Ultimate Edition</p>
                </div>
                <div class="header-actions">
                    <button id="coffee-btn" class="icon-btn" type="button" title="Buy me a coffee" data-i18n-title="buyCoffee">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </button>
                    <button class="icon-btn settings-trigger" type="button" title="Settings" data-i18n-title="settings">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3.17 14H3a2 2 0 0 1 0-4h.17A1.65 1.65 0 0 0 4.68 8.98a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82A1.65 1.65 0 0 0 20.83 10H21a2 2 0 0 1 0 4h-.17A1.65 1.65 0 0 0 19.4 15z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <main class="capture-main">
                <button id="pick-btn" class="capture-button" type="button" aria-label="Pick color" data-i18n-aria-label="pickColor">
                    <span class="capture-ring"></span>
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m2 22 1-1h3l9-9"></path>
                        <path d="M3 21v-3l9-9"></path>
                        <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"></path>
                    </svg>
                </button>

                <div class="capture-copy">
                    <p id="capture-title" data-i18n="captureCta">Choisir une couleur à l'écran</p>
                    <p id="capture-feedback" class="capture-feedback hidden">#2563EB copié</p>
                </div>

                <button id="history-open-btn" class="history-pill" type="button">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span data-i18n="history">Historique</span>
                    <span id="history-count" class="count-badge">0</span>
                </button>
            </main>

            <footer class="app-footer">
                <a href="https://bitek.fr" target="_blank" rel="noopener noreferrer" class="promo-link" data-i18n="promo">✨ Plus d'outils gratuits ? C'est par ici bitek.fr ✨</a>
            </footer>
        </section>

        <section id="details-view" class="view details-view hidden" aria-hidden="true">
            <header class="app-header details-header">
                <button id="back-btn" class="back-btn" type="button" aria-label="Back" data-i18n-aria-label="back">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                </button>
                <h1 data-i18n="detailsTitle">Inspecteur couleur</h1>
                <div class="header-actions">
                    <button class="icon-btn coffee-trigger" type="button" title="Buy me a coffee" data-i18n-title="buyCoffee">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </button>
                    <button class="icon-btn settings-trigger" type="button" title="Settings" data-i18n-title="settings">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3.17 14H3a2 2 0 0 1 0-4h.17A1.65 1.65 0 0 0 4.68 8.98a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82A1.65 1.65 0 0 0 20.83 10H21a2 2 0 0 1 0 4h-.17A1.65 1.65 0 0 0 19.4 15z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <main class="details-main">
                <section class="detail-hero">
                    <button id="hero-swatch" class="hero-swatch" type="button" aria-label="Choisir une couleur" data-i18n-aria-label="pickColor">
                        <span class="hero-swatch-fill" aria-hidden="true"></span>
                    </button>
                    <div class="hero-content">
                        <div id="font-control" class="font-control">
                            <button id="preview-font-trigger" class="font-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="font-picker-panel" aria-label="Police" data-i18n-aria-label="font">
                                <span id="preview-font-label" class="font-picker-value">System</span>
                            </button>
                            <div id="font-picker-panel" class="font-picker-panel hidden">
                                <input id="font-search" class="font-search" type="search" autocomplete="off" placeholder="Rechercher une font" aria-label="Rechercher une font" data-i18n-placeholder="fontSearch" data-i18n-aria-label="fontSearch">
                                <div id="font-list" class="font-list" role="listbox" aria-label="Police" data-i18n-aria-label="font"></div>
                                <div id="font-scrollbar" class="font-scrollbar" aria-hidden="true">
                                    <span id="font-scrollbar-thumb" class="font-scrollbar-thumb"></span>
                                </div>
                            </div>
                        </div>
                        <div class="hero-preview-row">
                            <input id="usage-input" type="text" value="Texte" aria-label="Preview text" data-i18n-aria-label="previewText">
                            <div id="usage-button" class="usage-button">Bouton</div>
                        </div>
                        <div id="usage-text" class="usage-text">Texte</div>
                    </div>
                </section>

                <section class="detail-grid">
                    <article class="detail-card formats-card">
                        <div class="format-list">
                            <button class="format-row copy-action" type="button" data-copy-kind="hex">
                                <span>HEX</span>
                                <strong id="format-hex">#2563EB</strong>
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button class="format-row copy-action" type="button" data-copy-kind="rgb">
                                <span>RGB</span>
                                <strong id="rgb-value">37, 99, 235</strong>
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button class="format-row copy-action" type="button" data-copy-kind="hsl">
                                <span>HSL</span>
                                <strong id="hsl-value">221°, 83%, 53%</strong>
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button class="format-row copy-action" type="button" data-copy-kind="oklch">
                                <span>OKLCH</span>
                                <strong id="oklch-value">0.62, 0.16, 250</strong>
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </article>

                    <article class="detail-card code-card">
                        <h2 data-i18n="code">Code</h2>
                        <div class="code-block">
                            <div class="code-tabs" role="tablist" aria-label="Code format" data-i18n-aria-label="codeFormat">
                                <button class="code-tab active" type="button" data-code-format="css">CSS</button>
                                <button class="code-tab" type="button" data-code-format="tailwind">Tailwind</button>
                                <button class="code-tab" type="button" data-code-format="swiftui">SwiftUI</button>
                                <button class="code-tab" type="button" data-code-format="react">React</button>
                            </div>
                            <div class="code-output-row">
                                <code id="code-output">--color-primary: #2563EB;</code>
                                <button class="code-copy-btn copy-action" type="button" data-copy-kind="code" title="Copy code" data-i18n-title="copyCode">
                                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </article>
                </section>

                <section class="history-card-section">
                    <div class="section-title-row">
                        <div class="history-selector-wrap">
                            <button id="collection-trigger" class="history-selector-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="collection-panel" aria-label="Collection de couleurs" data-i18n-aria-label="colorCollection">
                                <span id="collection-label">Historique</span>
                                <span class="history-selector-chevron" aria-hidden="true"></span>
                            </button>
                            <div id="collection-panel" class="history-selector-panel hidden" role="listbox" aria-label="Collection de couleurs" data-i18n-aria-label="colorCollection">
                                <button class="history-selector-option" type="button" role="option" data-collection="history" aria-selected="true">
                                    <span data-i18n="history">Historique</span>
                                    <span class="history-selector-check" aria-hidden="true">✓</span>
                                </button>
                                <button class="history-selector-option" type="button" role="option" data-collection="favorites" aria-selected="false">
                                    <span data-i18n="favorites">Favoris</span>
                                    <span class="history-selector-check" aria-hidden="true">✓</span>
                                </button>
                            </div>
                        </div>
                        <button id="clear-collection-btn" class="history-clear-btn" type="button" aria-label="Vider l'historique">
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                                <path d="M10 11v6"></path>
                                <path d="M14 11v6"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="history-row">
                        <div id="color-history" class="history-grid"></div>
                    </div>
                </section>
            </main>

            <footer class="app-footer details-footer">
                <a href="https://bitek.fr" target="_blank" rel="noopener noreferrer" class="promo-link" data-i18n="promo">✨ Plus d'outils gratuits ? C'est par ici bitek.fr ✨</a>
            </footer>
        </section>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="settings">Settings</h2>
                <button id="close-settings" class="close-btn" type="button" aria-label="Close settings" data-i18n-aria-label="closeSettings">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-card">
                    <div class="setting-row">
                        <label for="language-select" data-i18n="language">Language</label>
                        <select id="language-select">
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="es">Español</option>
                            <option value="de">Deutsch</option>
                            <option value="pt">Português</option>
                            <option value="zh">简体中文</option>
                            <option value="ja">日本語</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label for="theme-select" data-i18n="theme">Theme</label>
                        <select id="theme-select">
                            <option value="system" data-i18n="system">System</option>
                            <option value="light" data-i18n="light">Light</option>
                            <option value="dark" data-i18n="dark">Dark</option>
                        </select>
                    </div>
                </div>

                <div id="custom-theme-controls" class="settings-card hidden">
                    <div class="color-picker-row">
                        <label data-i18n="bgColor">Background</label>
                        <input type="color" id="custom-bg-color" value="#ffffff">
                    </div>
                    <div class="color-picker-row">
                        <label data-i18n="cardColor">Card</label>
                        <input type="color" id="custom-card-color" value="#f3f4f6">
                    </div>
                    <div class="color-picker-row">
                        <label data-i18n="textColor">Text</label>
                        <input type="color" id="custom-text-color" value="#1f2937">
                    </div>
                    <div class="color-picker-row">
                        <label data-i18n="accentColor">Accent</label>
                        <input type="color" id="custom-accent-color" value="#2563eb">
                    </div>
                </div>

                <a href="https://buymeacoffee.com/bitek" target="_blank" rel="noopener noreferrer" class="support-row">
                    <span class="support-icon">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </span>
                    <span data-i18n="supportFreeTools">Support free tools</span>
                    <span class="chevron">›</span>
                </a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden">
        <span id="toast-message">Copied!</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
