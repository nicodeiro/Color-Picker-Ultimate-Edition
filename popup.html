<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker : Ultimate Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1 data-i18n="title">Color Picker</h1>
                <div class="header-actions">
                    <button id="coffee-btn" title="Buy me a coffee" data-i18n-title="buyCoffee">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </button>
                    <button id="settings-btn" title="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <main>
            <!-- Color Preview -->
            <div class="color-preview-container">
                <div id="color-preview" class="color-preview">
                    <span class="no-color" data-i18n="noColor">No color selected</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="pick-btn" class="pick-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m2 22 1-1h3l9-9"></path>
                        <path d="M3 21v-3l9-9"></path>
                        <path
                            d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z">
                        </path>
                    </svg>
                    <span data-i18n="pickColor">Pick Color</span>
                </button>
                <button id="create-btn" class="create-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span data-i18n="newColor">New Color</span>
                </button>
            </div>

            <!-- Color Creator Panel -->
            <div id="color-creator" class="color-creator hidden">
                <div class="creator-header">
                    <h3 data-i18n="createColor">Create a Color</h3>
                    <button id="close-creator" class="close-creator-btn">&times;</button>
                </div>
                <!-- Color Picker Canvas -->
                <div class="picker-area">
                    <canvas id="color-canvas" class="color-canvas" width="280" height="160"></canvas>
                    <div id="canvas-cursor" class="canvas-cursor"></div>
                </div>
                <!-- Hue Slider -->
                <div class="hue-slider-container">
                    <input type="range" id="hue-slider" class="hue-slider" min="0" max="360" value="0">
                </div>
                <!-- Preview and Apply -->
                <div class="creator-bottom">
                    <div id="creator-preview" class="creator-preview-box"></div>
                    <span id="creator-hex" class="creator-hex">#FF0000</span>
                    <button id="apply-color-btn" class="apply-color-btn" data-i18n="applyColor">Apply Color</button>
                </div>
            </div>

            <!-- Color Codes -->
            <div id="color-codes" class="color-codes hidden">
                <div class="color-code-item" data-format="hex">
                    <span class="code-label">HEX</span>
                    <span id="hex-value" class="code-value">#000000</span>
                    <button class="copy-btn" data-target="hex-value" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div class="color-code-item" data-format="rgb">
                    <span class="code-label">RGB</span>
                    <span id="rgb-value" class="code-value">rgb(0, 0, 0)</span>
                    <button class="copy-btn" data-target="rgb-value" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div class="color-code-item" data-format="hsl">
                    <span class="code-label">HSL</span>
                    <span id="hsl-value" class="code-value">hsl(0, 0%, 0%)</span>
                    <button class="copy-btn" data-target="hsl-value" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Color History -->
            <div class="history-section">
                <div class="history-header">
                    <h2 data-i18n="history">History</h2>
                    <button id="clear-history-btn" class="clear-btn" data-i18n="clear">Clear</button>
                </div>
                <div id="color-history" class="color-history">
                    <div class="no-history" data-i18n="noHistory">No colors in history</div>
                </div>
            </div>
        </main>
        <footer>
            <a href="https://bitek.fr" target="_blank" rel="noopener noreferrer" class="promo-link" data-i18n="promo">✨
                More free tools? Check out bitek.fr ✨</a>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="settings">Settings</h2>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label data-i18n="language">Language</label>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                        <option value="zh">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ru">Русский</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label data-i18n="theme">Theme</label>
                    <select id="theme-select">
                        <option value="system" data-i18n="system">System</option>
                        <option value="light" data-i18n="light">Light</option>
                        <option value="dark" data-i18n="dark">Dark</option>
                        <option value="midnight" data-i18n="midnight">Midnight</option>
                        <option value="latte" data-i18n="latte">Latte</option>
                        <option value="forest" data-i18n="forest">Forest</option>
                        <option value="neon" data-i18n="neon">Neon</option>
                        <option value="rose" data-i18n="rose">Rose</option>
                        <option value="custom" data-i18n="custom">Custom</option>
                    </select>
                </div>
                <div id="custom-theme-controls" class="setting-group hidden">
                    <div class="color-picker-group">
                        <label data-i18n="bgColor">Background</label>
                        <input type="color" id="custom-bg-color" value="#ffffff">
                    </div>
                    <div class="color-picker-group">
                        <label data-i18n="cardColor">Card</label>
                        <input type="color" id="custom-card-color" value="#f3f4f6">
                    </div>
                    <div class="color-picker-group">
                        <label data-i18n="textColor">Text</label>
                        <input type="color" id="custom-text-color" value="#1f2937">
                    </div>
                    <div class="color-picker-group">
                        <label data-i18n="accentColor">Accent</label>
                        <input type="color" id="custom-accent-color" value="#2563eb">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toast-message">Copied!</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
