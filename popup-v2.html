<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Color Picker Ultimate Edition</title>
  <link rel="stylesheet" href="popup-v2.css">
</head>
<body>
  <div id="app" class="app" aria-busy="true">
    <header class="app-header">
      <h1>Color Picker</h1>
      <button
        id="settings-button"
        class="icon-button settings-button"
        type="button"
        data-icon="Settings"
        aria-haspopup="dialog"
        aria-controls="settings-dialog"
        aria-label="Settings"
        disabled
      ></button>
    </header>

    <main id="main-content" class="main-content">
      <section id="loading-view" class="view loading-view" aria-labelledby="loading-title">
        <h2 id="loading-title" class="view-title" data-message="loading">Loading…</h2>
      </section>

      <section id="empty-view" class="view empty-view" aria-labelledby="empty-title" hidden>
        <div class="empty-copy">
          <h2 id="empty-title" class="view-title" data-message="emptyTitle">Choose a color on screen.</h2>
          <p id="empty-notice" class="inline-notice"></p>
        </div>
        <button id="pick-button" class="primary-button" type="button" data-message="pick">Choose a color</button>
        <p class="empty-history" data-message="noRecent">No recent color.</p>
      </section>

      <section id="result-view" class="view result-view" aria-labelledby="result-title" hidden>
        <h2 id="result-title" class="proof-label" tabindex="-1" data-message="selectedSrgb">Selected color · sRGB</h2>
        <p id="result-notice" class="inline-notice result-notice"></p>

        <div class="proof-row">
          <span id="current-specimen" class="current-specimen" aria-hidden="true"></span>
          <strong id="hex-value" class="hex-value">#000000</strong>
          <button id="copy-hex-button" class="icon-button copy-hex-button" type="button" data-icon="Copy" aria-label="Copy #000000"></button>
          <div id="hex-feedback" class="copy-feedback" hidden>
            <span id="feedback-icon" class="feedback-icon" data-icon="CircleCheck" aria-hidden="true"></span>
            <span id="feedback-text"></span>
          </div>
        </div>

        <div class="format-list" aria-label="Color formats" data-message-aria="formatListLabel">
          <div class="format-row">
            <span class="format-label">RGB</span>
            <span class="format-value-block">
              <strong id="rgb-value" class="format-value">0, 0, 0</strong>
              <span id="rgb-feedback" class="format-inline-feedback" hidden></span>
            </span>
            <button id="copy-rgb-button" class="icon-button format-copy-button" type="button" data-icon="Copy" aria-label="Copy RGB 0, 0, 0"></button>
          </div>
          <div class="format-row">
            <span class="format-label">HSL</span>
            <span class="format-value-block">
              <strong id="hsl-value" class="format-value">0°, 0%, 0%</strong>
              <span id="hsl-feedback" class="format-inline-feedback" hidden></span>
            </span>
            <button id="copy-hsl-button" class="icon-button format-copy-button" type="button" data-icon="Copy" aria-label="Copy HSL 0°, 0%, 0%"></button>
          </div>
        </div>

        <div id="recent-list" class="recent-list"></div>

        <button id="pick-another-button" class="primary-button result-primary" type="button" data-message="pickAnother">Choose another color</button>
      </section>

      <section id="error-view" class="view error-view" aria-labelledby="error-title" hidden>
        <div>
          <h2 id="error-title" class="view-title" tabindex="-1"></h2>
          <p id="error-body" class="error-body"></p>
        </div>
        <button id="error-action" class="primary-button" type="button"></button>
      </section>
    </main>

    <p id="polite-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="critical-alert" class="sr-only" role="alert" aria-atomic="true"></p>
  </div>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-note">
    <div class="dialog-header">
      <h2 id="settings-title" data-message="settings">Settings</h2>
      <button id="settings-close-icon" class="icon-button dialog-close-button" type="button" data-icon="X" aria-label="Close"></button>
    </div>

    <div class="settings-fields">
      <label class="field-label" for="language-select" data-message="language">Language</label>
      <select id="language-select" class="select-control">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="ru">Русский</option>
      </select>

      <label class="field-label" for="theme-select" data-message="theme">Theme</label>
      <select id="theme-select" class="select-control">
        <option value="system" data-message="themeSystem">System</option>
        <option value="light" data-message="themeLight">Light</option>
        <option value="dark" data-message="themeDark">Dark</option>
      </select>
    </div>

    <p id="settings-note" class="settings-note" data-message="settingsNote">History and preferences stay on this device.</p>
    <p id="settings-feedback" class="settings-feedback" aria-live="polite" aria-atomic="true"></p>
    <button id="settings-done-button" class="primary-button dialog-done-button" type="button" data-message="done">Done</button>
  </dialog>

  <script type="module" src="popup-v2.js"></script>
</body>
</html>
